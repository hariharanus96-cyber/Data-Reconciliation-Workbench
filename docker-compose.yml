services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconciliation"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/reconciliation
      SPRING_DATASOURCE_USERNAME: reconcile
      SPRING_DATASOURCE_PASSWORD: reconcile
      RECONCILIATION_TOLERANCE: ${RECONCILIATION_TOLERANCE:-0.02}
    depends_on:
      database:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
volumes:
  postgres_data: